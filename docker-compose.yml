version: '3.8'

services:
  # ============ 数据库 ============
  postgres:
    image: postgres:16-alpine
    container_name: social_feed_postgres
    environment:
      POSTGRES_DB: social_feed
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d social_feed"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: social_feed_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============ API 服务 ============
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: social_feed_api
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-change_me}@postgres:5432/social_feed
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============ Worker ============
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: social_feed_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-change_me}@postgres:5432/social_feed
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1

  # ============ Beat (定时任务) ============
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.beat
    container_name: social_feed_beat
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-change_me}@postgres:5432/social_feed
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: social_feed_network
